name: Test and deploy INTERVAL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site/assets _site/docs
          cp index.html styles.css app.js engine.js scoring.js session.js sw.js manifest.webmanifest _site/
          cp assets/* _site/assets/
          cp docs/regras.pdf docs/VALIDACAO_v0.5.md _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
